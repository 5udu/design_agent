name: Validate enterprise workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: design_agent_test
          POSTGRES_PASSWORD: disposable_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d design_agent_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:disposable_ci_password@127.0.0.1:5432/design_agent_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.lock}
      - uses: actions/setup-node@v7
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements.lock && pip install --no-deps --no-build-isolation -e backend
      - run: python -m pytest backend/tests -q
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend test && npm --prefix frontend run build
      - run: cp .env.production.example .env.production && docker compose --env-file .env.production config --quiet
      - run: docker build -t design-agent:ci .
